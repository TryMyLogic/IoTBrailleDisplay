name: TestCode

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883

      homeassistant:
        image: ghcr.io/home-assistant/home-assistant:stable
        options: --privileged
        ports:
          - 8123:8123
        env:
          TZ: "UTC"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Duplicate code into the CI/CD runner

      - name: Check environment
        run: |
          echo "Running on $(uname -a)"
          echo "Docker version:"
          docker --version || echo "Docker CLI not available"
          echo "Are we inside a container?"
          cat /proc/1/cgroup || echo "No cgroup info"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Start Home Assistant
        run: |
          docker run -d --name homeassistant -p 8123:8123 ghcr.io/home-assistant/home-assistant:stable

      - name: Wait for Home Assistant
        run: |
          echo "Waiting for Home Assistant..."
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8123/.well-known/core)
            if [ "$STATUS" == "200" ]; then
              echo "Home Assistant is ready!"
              break
            fi
            echo "Still waiting..."
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo "Error: Home Assistant did not become ready."
            exit 1
          fi

      - name: Wait for Mosquitto
        run: |
          for i in {1..60}; do
            if nc -z localhost 1883; then
              echo "Mosquitto is up!"
              break
            fi
            echo "Waiting for Mosquitto..."
            sleep 2
          done

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: v1-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            v1-${{ runner.os }}-nuget-
        # Note: Change 'v1-' to 'v2-' to invalidate cache if dotnet-format version changes.
        # Alternatively, clear caches manually in GitHub UI: Actions > Caches > Delete.

      - name: Restore dependencies
        run: |
          dotnet restore DisplayLogic/DisplayLogic.csproj --verbosity normal
          dotnet restore DisplayLogic.Tests/DisplayLogic.Tests.csproj --verbosity normal

      - name: Build projects
        run: |
          dotnet build DisplayLogic/DisplayLogic.csproj --configuration Release --no-restore
          dotnet build DisplayLogic.Tests/DisplayLogic.Tests.csproj --configuration Release --no-restore

      - name: Dump Home Assistant logs
        run: docker logs $(docker ps -q --filter ancestor=homeassistant/home-assistant)

      - name: Run tests
        run: dotnet test DisplayLogic.Tests/DisplayLogic.Tests.csproj --no-build --configuration Release --verbosity normal # Run test project only
