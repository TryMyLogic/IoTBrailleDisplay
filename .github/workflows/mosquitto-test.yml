name: Run Tests with Mosquitto

on: [push, pull_request]

jobs:
  test:
    name: Run MQTT Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Start Mosquitto Broker
        run: |
          docker run -d \
            --name mosquitto-test \
            -p 1883:1883 \
            -v "${PWD}/.github/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf" \
            eclipse-mosquitto:2.0
          echo "Waiting for Mosquitto..."
          sleep 5  # optional: let broker fully start

      - name: Restore dependencies
        run: |
          dotnet restore DisplayLogic/DisplayLogic.csproj --verbosity normal
          dotnet restore DisplayLogic.Tests/DisplayLogic.Tests.csproj --verbosity normal

      - name: Build projects
        run: |
          dotnet build DisplayLogic/DisplayLogic.csproj --configuration Release --no-restore
          dotnet build DisplayLogic.Tests/DisplayLogic.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DisplayLogic.Tests/DisplayLogic.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Stop Mosquitto
        if: always()
        run: docker stop mosquitto-test && docker rm mosquitto-test