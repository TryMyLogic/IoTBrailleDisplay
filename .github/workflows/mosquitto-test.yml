name: Run Tests with Mosquitto

on: [push, pull_request]

jobs:
  test:
    name: Run MQTT Tests
    runs-on: ubuntu-latest

    services:
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
        options: >-
          --mount type=bind,source=${{ github.workspace }}/.github/mosquitto/mosquitto.conf,target=/mosquitto/config/mosquitto.conf
          --health-cmd "mosquitto_pub -h localhost -p 1883 -t health -m test || exit 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore DisplayLogic/DisplayLogic.csproj --verbosity normal
          dotnet restore DisplayLogic.Tests/DisplayLogic.Tests.csproj --verbosity normal

      - name: Build projects
        run: |
          dotnet build DisplayLogic/DisplayLogic.csproj --configuration Release --no-restore
          dotnet build DisplayLogic.Tests/DisplayLogic.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DisplayLogic.Tests/DisplayLogic.Tests.csproj --no-build --configuration Release --verbosity normal