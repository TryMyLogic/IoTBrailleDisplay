name: Run Tests with Mosquitto

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mosquitto:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_sub -t 'test' -u 'testuser' -P 'testpass' -C 1 || exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
        volumes:
          - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Adjust to your .NET version
      - name: Create Mosquitto config
        run: |
          mkdir -p mosquitto
          cat << EOF > mosquitto/mosquitto.conf
          listener 1883
          allow_anonymous true
          persistence true
          persistence_location /mosquitto/data/
          log_dest file /mosquitto/log/mosquitto.log
          EOF
      - name: Run Tests
        run: dotnet test --logger "console;verbosity=detailed"
