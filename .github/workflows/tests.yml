name: MQTT Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Start Mosquitto
        run: docker-compose up -d

      - name: Wait for Mosquitto to be healthy
        run: |
          for i in {1..10}; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' iotbrailledisplay-mosquitto-1 2>/dev/null || echo "starting")
            echo "Mosquitto health: $HEALTH"
            if [ "$HEALTH" = "healthy" ]; then
              echo "✅ Mosquitto is healthy"
              break
            fi
            sleep 5
          done

      - name: Wait for Mosquitto
        run: |
          for i in {1..10}; do
            nc -z localhost 1883 && echo "Mosquitto is up!" && break
            echo "Waiting for Mosquitto..."
            sleep 3
          done

      - name: Run Unit Tests
        run: dotnet test --verbosity normal
        working-directory: DisplayLogic.Tests
